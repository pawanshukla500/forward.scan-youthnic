plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'shop.youthnic.scan'
    compileSdk 34

    defaultConfig {
        applicationId "shop.youthnic.scan"
        minSdk 23
        targetSdk 34

        def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        versionCode 10000 + Integer.parseInt(runNumber)
        versionName "1.0." + runNumber

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            def ksPath = System.getenv("FS_KEYSTORE")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            def ksPath = System.getenv("FS_KEYSTORE")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            def defaultApiUrl = System.getenv("API_URL") ?: "https://scan.youthnic.shop"
            buildConfigField "String", "DEFAULT_API_URL", "\"${defaultApiUrl}\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig (signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug)
            def defaultApiUrl = System.getenv("API_URL") ?: "https://scan.youthnic.shop"
            buildConfigField "String", "DEFAULT_API_URL", "\"${defaultApiUrl}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Barcode Scanning (Google Play Services unbundled: <= 2 MB added to APK)
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    implementation 'com.google.android.gms:play-services-base:18.5.0'

    // HTTP client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}

name: Build Android APK

# Production Android application for warehouse phones:
# Native Android Kotlin app with CameraX, ML Kit barcode scanning, Android KeyStore
# encryption, and R8 shrinking for ~2 GB RAM phones (package: shop.youthnic.scan).
#
# Runs by itself when the app code changes on main, and by hand (Actions -> Build Android APK -> Run workflow).
# Every published build is copied to the server (data/app on the VPS, kept across deploys):
#   - https://scan.youthnic.shop/download   public download page + QR (also shown in Admin)
#   - /api/app/latest                        installed apps compare versions and offer the update
# Preserves the legacy Capacitor workflow for parity verification.

on:
  push:
    branches:
      - main
    paths:
      - "mobile/android/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:
    inputs:
      build_engine:
        description: "Build engine ('native' or 'capacitor-legacy')"
        type: choice
        options:
          - native
          - capacitor-legacy
        default: native
      api_url:
        description: "Server the app talks to"
        required: true
        default: "https://scan.youthnic.shop"
      release_tag:
        description: "Release tag the APK is published under (reused/rolling)"
        required: true
        default: "forward-scan-app"
      publish:
        description: "Publish (server download page + in-app update + GitHub Release). Off = build-only check, APK kept as a run artifact"
        type: boolean
        required: false
        default: true
      notes:
        description: "What is new (shown in the update notification and on the download page). Empty = the commit title"
        required: false
        default: ""
      force_update:
        description: "Required update: older apps must install this version before scanning again"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-apk:
    name: Build Native Android Release APK
    if: inputs.build_engine == 'native' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android Packages
        run: |
          TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          [ -d "$TOOLS" ] || TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)
          export PATH="$TOOLS:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set Executable Permissions
        run: chmod +x gradlew

      - name: Setup Fixed Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is missing! Production release APK requires the fixed warehouse signing key."
            exit 1
          fi
          KS="$RUNNER_TEMP/forward-scan.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          keytool -list -keystore "$KS" -storepass android -alias androiddebugkey > /dev/null
          echo "FS_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "Using fixed signing key from ANDROID_DEBUG_KEYSTORE_B64"

      - name: Run Native Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble Release APK (R8 & Resource Shrink)
        env:
          API_URL: ${{ inputs.api_url || 'https://scan.youthnic.shop' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Find Release APK
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"
          echo "Found release APK: $APK"

      # Verify Package ID: MUST be shop.youthnic.scan
      - name: Verify Package ID and Version Code
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$RELEASE_APK" > /tmp/badging.txt
          cat /tmp/badging.txt | grep -E "package: name="

          PKG=$(grep -o "name='[^']*'" /tmp/badging.txt | head -1 | cut -d"'" -f2)
          if [ "$PKG" != "shop.youthnic.scan" ]; then
            echo "::error::Package ID mismatch! Expected 'shop.youthnic.scan', got '$PKG'"
            exit 1
          fi
          echo "Package ID verified: $PKG"

          VCODE=$(grep -o "versionCode='[^']*'" /tmp/badging.txt | head -1 | cut -d"'" -f2)
          echo "versionCode is: $VCODE"
          if [ "$VCODE" -lt 10000 ]; then
            echo "::error::versionCode ($VCODE) must be >= 10000 to guarantee monotonic update over previous APK!"
            exit 1
          fi
          echo "APP_VCODE=$VCODE" >> "$GITHUB_ENV"

      # Verify Camera Permission
      - name: Verify Camera Permission
        run: |
          grep -q "uses-permission: name='android.permission.CAMERA'" /tmp/badging.txt || {
            echo "::error::android.permission.CAMERA is missing from APK!"
            exit 1
          }
          echo "Camera permission verified in APK."

      # Verify Signing Certificate
      - name: Verify Signing Certificate
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$RELEASE_APK" | tee /tmp/certs.txt | grep -E "SHA-256|DN"
          if [ -n "${FS_KEYSTORE:-}" ]; then
            EXPECTED=$(keytool -list -v -keystore "$FS_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 "SHA256:" | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
            ACTUAL=$(grep -m1 "SHA-256 digest" /tmp/certs.txt | sed 's/.*digest: *//')
            echo "expected $EXPECTED"
            echo "actual   $ACTUAL"
            if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::APK certificate fingerprint ($ACTUAL) does not match expected keystore certificate ($EXPECTED)!"
              exit 1
            fi
            echo "Certificate matches expected signing key."
          fi

      # Measure APK Byte and MB Size (Budget: <= 20 MB hard ceiling, target <= 15 MB)
      - name: Check APK Size Budget
        run: |
          SIZE_BYTES=$(wc -c < "$RELEASE_APK")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "=============================================="
          echo "Final Native Android Release APK Size:"
          echo "$SIZE_BYTES bytes ($SIZE_MB MB)"
          echo "Target budget: <= 15 MB"
          echo "Hard limit:    <= 20 MB"
          echo "=============================================="

          # 20 MB hard budget = 20971520 bytes
          if [ "$SIZE_BYTES" -gt 20971520 ]; then
            echo "::error::APK size ($SIZE_MB MB) exceeds the approved hard budget of 20 MB!"
            exit 1
          fi
          echo "APK size budget check PASSED."

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forward-scan-app
          path: mobile/android/${{ env.RELEASE_APK }}
          if-no-files-found: error

      # The server serves data/app/forward-scan-app.apk + latest.json (backend/app/routers/mobile_app.py):
      # the public download page / QR, and the version the installed apps compare against.
      - name: Refuse to publish a build for another server
        if: ${{ github.event_name != 'push' && inputs.publish && inputs.api_url != 'https://scan.youthnic.shop' }}
        run: |
          echo "::error::This build talks to ${{ inputs.api_url }} - publishing it would move every production phone there. Run with publish off."
          exit 1

      - name: Write version file for the server
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          RELEASE_NOTES: ${{ inputs.notes || github.event.head_commit.message || '' }}
          FORCE_UPDATE: ${{ inputs.force_update && 'true' || 'false' }}
          GIT_SHA: ${{ github.sha }}
        run: python3 ../../.github/scripts/app_release_meta.py "$RELEASE_APK" "$APP_VCODE" /tmp/latest.json

      - name: Publish APK to the server (download page, QR, in-app updates)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || '200.141.1.119' }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || 'root' }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'scan.youthnic.shop' }}
        run: |
          if [ -z "$HOSTINGER_SSH_KEY" ]; then
            echo "::warning::HOSTINGER_SSH_KEY is not set - the APK was NOT copied to the server (no in-app update)."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3 4 5; do
            ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 2
          done
          SSH="ssh -p $HOSTINGER_PORT -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          SCP="scp -P $HOSTINGER_PORT -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          # mounted in the container as /app/data/app (APP_RELEASE_DIR); deploy.yml keeps data/ across deploys
          DEST=/opt/forward-scan/Forward-Scan/data/app
          $SSH "$HOSTINGER_USER@$HOSTINGER_HOST" "mkdir -p $DEST"
          $SCP "$RELEASE_APK" "$HOSTINGER_USER@$HOSTINGER_HOST:$DEST/.forward-scan-app.apk.uploading"
          $SCP /tmp/latest.json "$HOSTINGER_USER@$HOSTINGER_HOST:$DEST/.latest.json.uploading"
          # APK first, then the version file: a phone never sees a version whose APK is not there yet
          $SSH "$HOSTINGER_USER@$HOSTINGER_HOST" "cd $DEST && mv -f .forward-scan-app.apk.uploading forward-scan-app.apk && mv -f .latest.json.uploading latest.json && ls -la $DEST"
          echo "Published version code $APP_VCODE - download page: https://$APP_DOMAIN/download"
          curl -fsS "https://$APP_DOMAIN/api/app/latest" || echo "::warning::The server did not answer /api/app/latest (it serves the app once a deploy with routers/mobile_app.py is live)"

      - name: Prepare APK for Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: cp "$RELEASE_APK" app/build/outputs/apk/release/forward-scan-app.apk

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'forward-scan-app' }}
          name: Forward Scan Native App (${{ inputs.release_tag || 'forward-scan-app' }})
          body: |
            Native Android warehouse application (Kotlin, CameraX, ML Kit).
            Package: shop.youthnic.scan
            Version: 1.0.${{ github.run_number }} (code: ${{ env.APP_VCODE }})
            Built from commit ${{ github.sha }} against ${{ inputs.api_url || 'https://scan.youthnic.shop' }}.
            Phones install it from https://scan.youthnic.shop/download (QR code in Admin) and get later versions as in-app updates.

            Features:
            - Native CameraX always-on barcode scanner
            - ML Kit 1-D barcode recognition (Code128, Code39, EAN, ITF)
            - Pending list per marketplace on the scan screen
            - Update notification and in-app install of new versions
            - 90-day mobile device session refresh with Android KeyStore encryption
            - Fast, lightweight design optimized for ~2 GB RAM devices
          prerelease: true
          make_latest: true
          files: mobile/android/app/build/outputs/apk/release/forward-scan-app.apk
          fail_on_unmatched_files: true

  capacitor-legacy-apk:
    name: Build Legacy Capacitor APK (Parity Check)
    if: inputs.build_engine == 'capacitor-legacy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android Packages
        run: |
          TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          [ -d "$TOOLS" ] || TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)
          export PATH="$TOOLS:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web UI for the App
        env:
          VITE_API_URL: ${{ inputs.api_url }}
        run: npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Declare Camera Permission
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          m = Path("android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          if "android.permission.CAMERA" not in s:
              s = s.replace("</manifest>", '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n</manifest>')
              m.write_text(s)
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

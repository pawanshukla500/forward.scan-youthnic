name: Build Android APK

# Installable app for the warehouse phones: bundles the web UI with Capacitor and a
# native ML Kit barcode scanner (embedded, always-on camera). Produces a debug APK that
# installs directly on Android (allow "Install unknown apps" once). Run from the Actions
# tab - the APK lands on a GitHub Release so phones can download it straight from GitHub.
# Login works with the same username/password; the app signs in by Bearer token and
# stays signed in on the device (no cookies needed).
#
# Updates install over the old app only if every build is signed with the SAME key:
# put a keystore (alias androiddebugkey, password android) base64-encoded in the
# ANDROID_DEBUG_KEYSTORE_B64 repository secret. Without it each build gets a throwaway
# key and phones must uninstall the old app first (the job warns about it).

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server the app talks to"
        required: true
        default: "https://scan.youthnic.shop"
      release_tag:
        description: "Release tag the APK is published under (reused/rolling)"
        required: true
        default: "forward-scan-app"
      publish:
        description: "Publish to the GitHub Release (off = build-only check, APK kept as a run artifact)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ubuntu runners already ship the Android SDK - just make sure the packages
      # Capacitor needs are present (the setup-android action is broken: it asks
      # sdkmanager for the long-removed "tools" package and fails).
      - name: Install Android Packages
        run: |
          TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          [ -d "$TOOLS" ] || TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)
          export PATH="$TOOLS:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web UI for the App
        env:
          VITE_API_URL: ${{ inputs.api_url }}
        run: |
          npm run build
          # fail fast if the server URL did not make it into the bundle - without it
          # the app shows "Failed to fetch" on login and nothing works
          grep -o "${{ inputs.api_url }}" dist/assets/*.js | head -1

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # The ML Kit plugin does not declare CAMERA itself and neither does the default
      # Capacitor manifest - without this the app shows "No permissions requested" and the
      # system can never grant camera access, so scanning fails with "permission blocked".
      - name: Declare Camera Permission
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          m = Path("android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          if "android.permission.CAMERA" not in s:
              assert "</manifest>" in s
              s = s.replace("</manifest>", '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n</manifest>')
              m.write_text(s)
          assert "android.permission.CAMERA" in m.read_text()
          print("camera permission declared")
          EOF

      # Same look as the web app: brand-green icon with the white scan mark (adaptive, round,
      # themed and pre-Android-8 variants), green launch screen, brand status bar colours.
      # Vector XML only (frontend/android-res) - Capacitor's default PNG icons and splash go.
      - name: Brand Icon, Splash and Colours
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-*/ic_launcher*.png $RES/drawable*/splash.png
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          cp -r android-res/. $RES/
          python3 - <<'EOF'
          from pathlib import Path
          p = Path("android/app/src/main/res/values/styles.xml")
          s = p.read_text()
          launch = '<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">'
          assert launch in s, "launch theme not found"
          if "windowSplashScreenBackground" not in s:
              s = s.replace(launch, launch + '\n        <item name="windowSplashScreenBackground">@color/ic_launcher_background</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/ic_launcher_foreground</item>')
          p.write_text(s)
          print(s)
          EOF
          ls -R $RES | grep -E "ic_launcher|splash"

      # versionName 1.0.<run> shows in Android's App info, so anyone can see which build a phone runs.
      - name: Version the App
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Fixed Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the fixed key from ANDROID_DEBUG_KEYSTORE_B64 - updates install over the previous app."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set: this APK gets a throwaway signing key, so phones must uninstall the old Forward Scan app before installing it."
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show Signing Certificate
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|DN"

      # Ground truth for what App info will list: fail the job if CAMERA is missing from the APK.
      - name: Verify Camera Permission in APK
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.CAMERA'" /tmp/badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forward-scan-app
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for Release
        if: ${{ inputs.publish }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/forward-scan-app.apk

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Forward Scan app (${{ inputs.release_tag }})
          body: |
            Installable Android app for the warehouse phones - version 1.0.${{ github.run_number }} (App info shows it). Built from ${{ github.sha }} against ${{ inputs.api_url }}.

            Install: download forward-scan-app.apk on the phone, allow "Install unknown apps" once, then sign in with the same Forward Scan username and password.
            If Android says "App not installed", uninstall the old Forward Scan app once and install again (happens when the signing key changed).
          prerelease: true
          make_latest: true
          files: frontend/android/app/build/outputs/apk/debug/forward-scan-app.apk
          fail_on_unmatched_files: true
